<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Η βάπτιση της Ευδοκίας</title>

  <!-- Open Graph / WhatsApp Preview Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Η Βάπτιση της Ευδοκίας">
  <meta property="og:description" content="Κυριακή 18 Οκτωβρίου 2026 στις 12:30 | Ι.Ν. Αγίας Τριάδας Γλυφάδας">
  <meta property="og:image" content="https://eudokia-goes-bloom.github.io/eudokia/invitation.png">
  <meta property="og:url" content="https://eudokia-goes-bloom.github.io/eudokia/">

  <style>
    :root {
      --bg: #eee7de;
      --ink: #3f777b;
      --rose: #ce5e82;
      --paper: #fbf7f1;
      --shadow: 0 18px 50px rgba(67, 43, 35, .14);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      font-family: Georgia, "Times New Roman", serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .page {
      width: min(100%, 920px);
      padding: 24px 14px 36px;
    }
    .invite {
      position: relative;
      width: 100%;
      background: var(--paper);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .invite img {
      display: block;
      width: 100%;
      height: auto;
    }
    .hotspot {
      position: absolute;
      z-index: 5;
      display: block;
      border-radius: 999px;
      text-decoration: none;
      cursor: pointer;
      outline: none;
    }
    .hotspot::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      background: rgba(206, 94, 130, .07);
      border: 1px solid rgba(206, 94, 130, .20);
      transition: .18s ease;
    }
    .hotspot:hover::before,
    .hotspot:focus-visible::before {
      opacity: 1;
      box-shadow: 0 0 0 4px rgba(206, 94, 130, .07);
    }

    .location-link {
      left: 34.5%;
      top: 72.8%;
      width: 61.5%;
      height: 4.4%;
    }
    .phone-link {
      left: 53.0%;
      top: 89.3%;
      width: 28.0%;
      height: 4.1%;
    }

    .tooltip {
      position: absolute;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: .18s ease;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(255, 250, 245, .97);
      color: var(--ink);
      border: 1px solid rgba(63, 119, 123, .18);
      box-shadow: 0 5px 16px rgba(67, 43, 35, .12);
      font: 600 12px/1 system-ui, sans-serif;
      white-space: nowrap;
    }
    .location-tip {
      left: 66%;
      top: 69.6%;
      transform: translate(-50%, 4px);
    }
    .phone-tip {
      left: 67%;
      top: 86.2%;
      transform: translate(-50%, 4px);
    }

    .location-link:hover + .location-tip,
    .location-link:focus-visible + .location-tip,
    .phone-link:hover + .phone-tip,
    .phone-link:focus-visible + .phone-tip {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .sr-only {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .hint {
      margin: 12px 0 0;
      text-align: center;
      color: #6d6863;
      font: 13px/1.45 system-ui, sans-serif;
    }
    @media (max-width: 640px) {
      .page { padding: 0; }
      .invite { box-shadow: none; }
      .tooltip { display: none; }
      .hint { padding: 0 16px 18px; }
    }
    @media print {
      body { background: #fff; }
      .page { width: 100%; padding: 0; }
      .invite { box-shadow: none; }
      .hotspot, .tooltip, .hint { display: none !important; }
    }
  </style>
</head>
<body>
<main class="page">
  <section class="invite" aria-label="Προσκλητήριο βάπτισης Ευδοκίας">
    <img src="invitation.png" alt="Προσκλητήριο Βάπτισης Ευδοκίας">

    <!-- Location Hotspot (Google Maps) -->
    <a class="hotspot location-link" href="https://maps.google.com/?q=Agia+Triada+Glyfada" target="_blank" rel="noopener">
      <span class="sr-only">Τοποθεσία: Ιερός Ναός Αγίας Τριάδας Γλυφάδας</span>
    </a>
    <span class="tooltip location-tip" aria-hidden="true">Άνοιγμα στους Χάρτες</span>

    <!-- RSVP Phone Hotspot -->
    <a class="hotspot phone-link" href="tel:+306900000000">
      <span class="sr-only">Τηλέφωνο Επικοινωνίας</span>
    </a>
    <span class="tooltip phone-tip" aria-hidden="true">Κλήση RSVP</span>
  </section>
  <p class="hint">Πατήστε στην τοποθεσία για οδηγίες πλοήγησης ή στο τηλέφωνο για επιβεβαίωση.</p>
</main>
</body>
</html>
